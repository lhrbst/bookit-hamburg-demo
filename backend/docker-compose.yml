services:
  postgres:
    image: postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookit
      POSTGRES_PASSWORD: bookit
      POSTGRES_DB: bookit
    ports:
      - '5432:5432'
    volumes:
      - bookit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookit -d bookit']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookit-postgres-data:
