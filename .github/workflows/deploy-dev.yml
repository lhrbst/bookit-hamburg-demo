name: Deploy dev

on:
  workflow_run:
    workflows: [Validate]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful main Validate run ID whose retained artifacts should deploy
        type: string
        required: true
      mode:
        description: Release runs migrations; rollback keeps the current database schema
        type: choice
        options: [release, rollback]
        default: release
      provision_database:
        description: Operator-only initial role provisioning or coordinated password rotation (requires review)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bookit-dev
  cancel-in-progress: false

jobs:
  source:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      rollback: ${{ steps.source.outputs.rollback }}
      provision: ${{ steps.source.outputs.provision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify main validation provenance before using artifacts or Azure
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-validation.mjs

  publish:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      api_image: ${{ steps.publish.outputs.api_image }}
      migration_image: ${{ steps.publish.outputs.migration_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-images
          path: .local/backend-images
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify validated bytes and publish without rebuilding
        id: publish
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          VALIDATION_RUN_ID: ${{ needs.source.outputs.run_id }}
          GHCR_API_IMAGE: ${{ vars.GHCR_API_IMAGE }}
          GHCR_MIGRATION_IMAGE: ${{ vars.GHCR_MIGRATION_IMAGE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-artifact.mjs verify .local/backend-images
          node scripts/publish-images.mjs

  prepare:
    needs: [source, publish]
    uses: ./.github/workflows/apply-dev.yml
    permissions:
      contents: read
      id-token: write
    with:
      sha: ${{ needs.source.outputs.sha }}
      phase: prepare
      api_image: ${{ needs.publish.outputs.api_image }}
      migration_image: ${{ needs.publish.outputs.migration_image }}
      rollback: ${{ needs.source.outputs.rollback == 'true' }}
      operator_approval: ${{ needs.source.outputs.provision == 'true' }}

  migrate:
    needs: [source, prepare]
    if: needs.source.outputs.rollback != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run explicitly approved operator provisioning
        if: needs.source.outputs.provision == 'true'
        env:
          JOB: ${{ fromJSON(needs.prepare.outputs.database_jobs).provision }}
        run: node scripts/run-database-job.mjs "$JOB"
      - name: Run migrations and demo entity seed; require exact execution success
        env:
          JOB: ${{ fromJSON(needs.prepare.outputs.database_jobs).release }}
        run: node scripts/run-database-job.mjs "$JOB"

  rollout:
    needs: [source, publish, prepare, migrate]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.migrate.result == 'success' ||
      (needs.source.outputs.rollback == 'true' && needs.migrate.result == 'skipped'))
    uses: ./.github/workflows/apply-dev.yml
    permissions:
      contents: read
      id-token: write
    with:
      sha: ${{ needs.source.outputs.sha }}
      phase: rollout
      api_image: ${{ needs.publish.outputs.api_image }}
      migration_image: ${{ needs.publish.outputs.migration_image }}
      rollback: ${{ needs.source.outputs.rollback == 'true' }}

  frontend:
    needs: [source, publish, rollout]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-release
          path: .local/frontend-release
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact and add public runtime configuration without rebuilding
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          API_BASE_URL: ${{ needs.rollout.outputs.api_url }}
        run: |
          node scripts/release-artifact.mjs verify .local/frontend-release
          npm --prefix frontend run configure -- ../.local/frontend-release/site
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Retrieve and mask SWA token for this upload only
        id: swa
        env:
          SWA_NAME: ${{ needs.rollout.outputs.swa_name }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        shell: bash
        run: |
          token="$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.apiKey -o tsv)"
          test -n "$token"
          printf '::add-mask::%s\n' "$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          action: upload
          app_location: .local/frontend-release/site
          skip_app_build: true
          skip_api_build: true
          production_branch: main
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
      - name: Post-deployment smoke checks
        env:
          API_BASE_URL: ${{ needs.rollout.outputs.api_url }}
          WEB_URL: ${{ needs.rollout.outputs.web_url }}
        run: node scripts/smoke-dev.mjs
      - name: Record non-sensitive release identity
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          VALIDATION_RUN_ID: ${{ needs.source.outputs.run_id }}
          API_IMAGE: ${{ needs.publish.outputs.api_image }}
          MIGRATION_IMAGE: ${{ needs.rollout.outputs.migration_image }}
          WEB_URL: ${{ needs.rollout.outputs.web_url }}
          MODE: ${{ needs.source.outputs.rollback == 'true' && 'rollback' || 'release' }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const names=["SOURCE_SHA","VALIDATION_RUN_ID","API_IMAGE","MIGRATION_IMAGE","WEB_URL","MODE"]; fs.writeFileSync(".local/release.json",JSON.stringify(Object.fromEntries(names.map(n=>[n,process.env[n]])),null,2));'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-release-${{ github.run_id }}
          path: .local/release.json
          if-no-files-found: error
          retention-days: 30
